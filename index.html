<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F2F2F2">
    <title>Viz Charts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/charts.css">
    <link rel="stylesheet" href="./src/gallery.css">
  </head>
  <body>
    <header class="masthead"><h1>Viz Charts</h1><button type="button" id="edit" aria-haspopup="dialog">Customize</button></header>
    <main>
      <div id="gallery" class="gallery"></div>
    </main>
    <dialog id="appearance" aria-labelledby="appearance-heading">
      <header class="dialog-heading"><h2 id="appearance-heading">Gallery appearance</h2><button class="icon-button" type="button" data-close aria-label="Close appearance settings">✕</button></header>
      <div class="dialog-content">
        <label>Theme <select id="page-theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label>
        <label>Color scheme <select id="page-palette"><option value="monochrome">Monochrome</option><option value="blue">Blue</option><option value="orange">Orange</option><option value="green">Green</option></select></label>
      </div>
    </dialog>
    <dialog id="editor" aria-labelledby="editor-heading">
      <header class="dialog-heading"><h2 id="editor-heading">Chart settings</h2><button class="icon-button" type="button" data-close aria-label="Close chart settings">✕</button></header>
      <div class="dialog-content">
        <p id="chart-name"></p>
        <label>Title <input id="title" type="text"></label>
        <label>Use gallery accent <input id="inherit-accent" type="checkbox"></label>
        <label>Chart accent <input id="accent" type="color"></label>
        <label>Font family <input id="font" type="text" placeholder="Noto Sans"></label>
        <label id="legend-position-field" hidden>List position
          <select id="legend-position"><option value="below">Below</option><option value="right" selected>Right</option><option value="left">Left</option></select>
        </label>
        <fieldset id="axes"><legend>Plot options</legend>
          <label>Horizontal axis <input id="axis-x" type="checkbox"></label>
          <label>Vertical axis <input id="axis-y" type="checkbox"></label>
          <label>Gridlines <input id="grid" type="checkbox"></label>
          <label id="show-volume-field" hidden>Show volume <input id="show-volume" type="checkbox"></label>
        </fieldset>
        <label>Configuration <textarea id="config" spellcheck="false" rows="9"></textarea></label>
        <div class="actions"><button type="button" id="apply">Apply JSON</button><button type="button" id="copy">Copy JSON</button><button type="button" id="reset">Reset</button></div>
        <p id="status" role="status"></p>
      </div>
    </dialog>
    <dialog id="data-dialog" aria-labelledby="data-heading">
      <header class="dialog-heading"><h2 id="data-heading">Chart data</h2><button class="icon-button" type="button" data-close aria-label="Close chart data">✕</button></header>
      <div class="dialog-content"><p id="data-name"></p><div id="data-table"></div></div>
    </dialog>
    <script type="module" src="./src/gallery.ts"></script>
  </body>
</html>
