<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFFFFF">
    <title>Viz Charts</title>
    <link rel="stylesheet" href="./src/charts.css">
    <link rel="stylesheet" href="./site/gallery.css">
  </head>
  <body>
    <main class="gallery-page" aria-label="Viz Charts">
      <div class="chart-nav">
        <div id="chart-types" class="chart-types" role="group" aria-label="Filter by chart type"></div>
        <button id="open-site-settings" class="icon-button site-settings-trigger" type="button" aria-label="Site settings" aria-haspopup="dialog" aria-controls="site-settings"></button>
      </div>
      <div id="gallery" class="gallery"></div>
    </main>
    <dialog id="site-settings" aria-labelledby="site-settings-heading">
      <header class="dialog-heading">
        <h2 id="site-settings-heading">Site settings</h2>
        <button class="icon-button close-button" type="button" data-close aria-label="Close site settings"></button>
      </header>
      <form id="site-appearance" class="site-settings-options">
        <fieldset class="theme-row" aria-label="Site theme">
          <span aria-hidden="true">Theme</span>
          <div class="segmented">
            <label><input type="radio" name="site-theme" value="light" checked><span>Light</span></label>
            <label><input type="radio" name="site-theme" value="dark"><span>Dark</span></label>
          </div>
        </fieldset>
        <div class="option-row"><span id="site-palette-label">Color scheme</span><select id="site-palette" aria-labelledby="site-palette-label"><option value="monochrome">Monochrome</option><option value="blue">Blue</option><option value="orange">Orange</option><option value="green">Green</option></select></div>
        <div class="actions site-settings-actions"><button id="apply-site-settings" type="submit">Apply to all charts</button></div>
      </form>
    </dialog>
    <dialog id="preview" class="preview-dialog" aria-labelledby="preview-heading">
      <div class="preview-content">
        <div class="preview-stage" id="preview-stage"><div class="preview-chart chart-theme" id="preview-chart"></div></div>
        <div class="preview-divider" id="preview-divider" role="separator" tabindex="0" aria-label="Chart preview height" aria-controls="preview-stage" aria-orientation="horizontal" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"></div>
        <section class="preview-options">
          <header class="preview-heading">
            <h2 id="preview-heading"></h2>
            <button class="icon-button close-button" type="button" data-close aria-label="Close chart preview" autofocus></button>
          </header>
          <div class="option-row" id="example-field" hidden><span id="preview-example-label">Example</span><select id="preview-example" aria-labelledby="preview-example-label"></select></div>
          <fieldset class="theme-row" aria-label="Chart theme">
            <span aria-hidden="true">Theme</span>
            <div class="segmented segmented-chart">
              <label><input type="radio" name="chart-theme" value="site" checked><span>Site</span></label>
              <label><input type="radio" name="chart-theme" value="light"><span>Light</span></label>
              <label><input type="radio" name="chart-theme" value="dark"><span>Dark</span></label>
            </div>
          </fieldset>
          <div class="option-row"><span id="chart-palette-label">Color scheme</span><select id="chart-palette" aria-labelledby="chart-palette-label"><option value="site">Site default</option><option value="monochrome">Monochrome</option><option value="blue">Blue</option><option value="orange">Orange</option><option value="green">Green</option></select></div>
          <div class="option-row"><span id="preview-range-label">Date range</span><div id="preview-range"></div></div>
          <div id="preview-controls" class="preview-actions"></div>
        </section>
      </div>
    </dialog>
    <dialog id="editor" aria-labelledby="editor-heading">
      <header class="dialog-heading"><h2 id="editor-heading">Chart settings</h2><button class="icon-button" type="button" data-close aria-label="Close chart settings">✕</button></header>
      <div class="dialog-content">
        <p id="chart-name"></p>
        <div class="option-row" id="legend-position-field" hidden><span id="legend-position-label">List position</span><select id="legend-position" aria-labelledby="legend-position-label"><option value="below">Below</option><option value="right" selected>Right</option><option value="left">Left</option></select></div>
        <fieldset id="axes"><legend>Plot options</legend>
          <label>Horizontal axis <input id="axis-x" type="checkbox"></label>
          <label>Vertical axis <input id="axis-y" type="checkbox"></label>
          <label>Gridlines <input id="grid" type="checkbox"></label>
          <label id="show-volume-field" hidden>Show volume <input id="show-volume" type="checkbox"></label>
        </fieldset>
        <label>Configuration <textarea id="config" spellcheck="false" rows="9"></textarea></label>
        <div class="actions"><button type="button" id="apply">Apply JSON</button><button type="button" id="copy">Copy JSON</button><button type="button" id="reset">Reset</button></div>
        <p id="status" role="status"></p>
      </div>
    </dialog>
    <dialog id="data-dialog" aria-labelledby="data-heading">
      <header class="dialog-heading"><h2 id="data-heading">Chart data</h2><button class="icon-button" type="button" data-close aria-label="Close chart data">✕</button></header>
      <div class="dialog-content"><p id="data-name"></p><div id="data-table"></div></div>
    </dialog>
    <script type="module" src="./site/gallery.ts"></script>
  </body>
</html>
